# =============================================================================
# Playwright Test Automation Framework - Docker Compose
# =============================================================================
# =============================================================================
#
# Usage:
#   docker-compose up regression         # Full suite, serially (the safe default)
#   docker-compose up smoke              # @P0 + @Smoke only, serially
#   docker-compose down                  # Stop and remove containers
#
#   docker-compose --profile sharded up  # 4-way sharding — READ THE WARNING BELOW FIRST
#
# WHY SHARDING IS BEHIND A PROFILE
# The specs drive shared, stateful UAT accounts (Testf2auto / Testf3auto / m4auto) through one
# browser session each, resuming from whatever journey position the account is parked at. Each
# shard is a separate Playwright PROCESS, so two shards can log into the same account at the same
# time and corrupt that position — and the damage outlives the run, because the next run resumes
# from the corrupted state. `--workers=1` does not help; it only serializes within one process.
# `docker-compose up` used to start all four shards at once, so the unsafe path was the default.
# Enable the profile only once each shard has its own dedicated accounts.
#
# =============================================================================

# No `version:` key — it is obsolete under Compose V2 (which warns about it), and `profiles:`
# below needs V2 regardless.

services:
  # Base service configuration (not run directly)
  playwright-base:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - CI=true
      - BASE_URL=${BASE_URL:-https://example.com}
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - ./tta-report:/app/tta-report

  # Shard 1 of 4
  shard-1:
    extends:
      service: playwright-base
    command: npx playwright test --shard=1/4 --reporter=list,json
    profiles: ["sharded"]
    container_name: playwright-shard-1

  # Shard 2 of 4
  shard-2:
    extends:
      service: playwright-base
    command: npx playwright test --shard=2/4 --reporter=list,json
    profiles: ["sharded"]
    container_name: playwright-shard-2

  # Shard 3 of 4
  shard-3:
    extends:
      service: playwright-base
    command: npx playwright test --shard=3/4 --reporter=list,json
    profiles: ["sharded"]
    container_name: playwright-shard-3

  # Shard 4 of 4
  shard-4:
    extends:
      service: playwright-base
    command: npx playwright test --shard=4/4 --reporter=list,json
    profiles: ["sharded"]
    container_name: playwright-shard-4

  # Smoke tests only (quick validation)
  smoke:
    extends:
      service: playwright-base
    command: npx playwright test --grep "@P0|@Smoke" --project=chromium --workers=1
    container_name: playwright-smoke

  # Full regression (all tests, single container)
  regression:
    extends:
      service: playwright-base
    command: npx playwright test --workers=1
    container_name: playwright-regression

  # Report merger (run after shards complete)
  merge-reports:
    extends:
      service: playwright-base
    command: npx playwright merge-reports --reporter html ./test-results
    profiles: ["sharded"]   # only meaningful when the shards ran
    container_name: playwright-merge
    depends_on:
      shard-1:
        condition: service_completed_successfully
      shard-2:
        condition: service_completed_successfully
      shard-3:
        condition: service_completed_successfully
      shard-4:
        condition: service_completed_successfully

# =============================================================================
# Volume definitions for persistent storage
# =============================================================================
volumes:
  test-results:
  playwright-report:
  tta-report:

