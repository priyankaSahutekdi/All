name: 🎭 Playwright Tests

# Trigger branches are this repo's ACTUAL branches. They were [main, develop]; neither exists
# here (the default branch is master), so this workflow had never fired — CI looked configured
# and was dormant.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag to run (e.g., @Smoke, @P0, @Regression)'
        required: false
        default: ''

env:
  CI: true
  NODE_VERSION: '20'

jobs:
  # Cheap, credential-free gate. This is what push/PR gets, because the E2E job below cannot
  # sensibly gate a commit: it needs UAT credentials, takes hours, and MUTATES the shared parked
  # accounts it drives (a run advances Testf2auto/Testf3auto's journey position permanently). A
  # suite with side effects on shared state is not a per-push check.
  verify:
    name: ✅ Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run build

      - name: 🧹 Lint
        run: npm run lint

  test:
    name: 🧪 Run Tests (${{ matrix.os }})
    # Manual only. See the `verify` job above for why this does not run on push/PR.
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install TTS Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng espeak-ng-data

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright Tests (serial)
        run: |
          if [ -n "${{ github.event.inputs.test_tag }}" ]; then
            npx playwright test --workers=1 --grep "${{ github.event.inputs.test_tag }}"
          else
            node scripts/run-e2e.js --regression
          fi
        shell: bash

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            tta-report/
          retention-days: 30

      - name: 📸 Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.os }}
          path: test-results/**/*.png
          retention-days: 7

      - name: 📊 Publish Report Summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Results - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ OS | ${{ matrix.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ▶️ Execution | serial (workers=1, no sharding — shared UAT accounts) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Browser | Chromium |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Download the report from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
        shell: bash

